<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070B14">
<title>RMES — Pricing Console</title>
<!-- PWA: installable on the phone home screen -->
<link rel="manifest" href="manifest-console.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RMES Console">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#070B14; --cab:#0C1421; --panel:#111C2E; --grid:#1B2C46;
  --neon:#35D0FF; --neon-dim:#1E86C0; --amber:#FFC542; --pink:#FF4D9D; --green:#4CE0A8;
  --txt:#DCEEFB; --dim:#7E9BB8;
  --px:'Press Start 2P', monospace;
  --mono:'IBM Plex Mono', monospace;
  --body:'Inter', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--void); color:var(--txt); font-family:var(--body);
  -webkit-font-smoothing:antialiased; overflow-x:hidden; padding-bottom:76px;
  background-image:
    radial-gradient(1200px 700px at 50% -10%, rgba(53,208,255,.10), transparent 60%),
    linear-gradient(transparent 0 2px, rgba(0,0,0,.16) 2px 4px);
  background-size:auto, 100% 4px;
}
.botbar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;justify-content:center;gap:10px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(7,11,20,.94);backdrop-filter:blur(8px);border-top:2px solid var(--grid)}
.botlink{flex:1;max-width:420px;text-align:center;text-decoration:none;
  font-family:var(--px);font-size:11px;letter-spacing:.02em;color:var(--void);background:var(--neon);
  border-radius:4px;padding:15px 12px;box-shadow:0 4px 0 #12688F;transition:transform .06s, box-shadow .06s}
.botlink:active{transform:translateY(3px);box-shadow:0 1px 0 #12688F}
/* CRT overlays */
.crt{position:fixed;inset:0;pointer-events:none;z-index:90}
.crt::before{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%)}
.crt::after{content:"";position:absolute;inset:0;opacity:.06;
  background:repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 3px)}

.shell{max-width:1180px;margin:0 auto;padding:0 16px;position:relative;z-index:2}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:60;background:rgba(7,11,20,.92);backdrop-filter:blur(6px);
  border-bottom:2px solid var(--grid)}
.hud-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;flex-wrap:wrap;padding:8px 0}
.logo{font-family:var(--px);font-size:11px;letter-spacing:.02em;color:var(--txt);line-height:1.6;text-decoration:none}
.logo b{color:var(--neon)}
.hud-right{display:flex;align-items:center;gap:10px}
.cloud{font-family:var(--mono);font-size:11px;font-weight:600;color:#a83b3b}
.kbtn{font-family:var(--mono);font-weight:700;font-size:12px;line-height:1.5;letter-spacing:.02em;cursor:pointer;
  background:var(--neon);color:var(--void);border:0;border-radius:3px;padding:11px 13px;
  box-shadow:0 4px 0 #12688F;transition:transform .06s, box-shadow .06s}
.kbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #12688F}
.kbtn.amber{background:var(--amber);box-shadow:0 4px 0 #9A6F14}
.kbtn.amber:active{box-shadow:0 1px 0 #9A6F14}
.kbtn.alt{background:transparent;color:var(--txt);border:2px solid var(--grid);box-shadow:0 4px 0 #0A1524}
.kbtn.alt:active{box-shadow:0 1px 0 #0A1524}
.kbtn[disabled]{opacity:.35;cursor:not-allowed;transform:none;box-shadow:0 4px 0 #12688F}
.kbtn.sm{font-size:9px;padding:9px 10px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- structure + date bar ---------- */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 14px}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  background:#0A1524;color:var(--dim);border:2px solid var(--grid);border-radius:2px;padding:9px 11px;cursor:pointer;transition:.15s}
.pill:hover{color:var(--txt);border-color:var(--neon-dim)}
.pill.on{background:var(--neon);color:var(--void);border-color:var(--neon);font-weight:600}

/* ---------- deck: single-day card, flip + swipe ---------- */
.deck-head{display:flex;align-items:center;gap:8px;max-width:440px;margin:16px auto 6px}
.deck-head .arw{font-family:var(--px);font-size:11px;background:#0A1524;color:var(--txt);border:2px solid var(--grid);
  border-radius:2px;padding:12px 12px;cursor:pointer;min-width:44px}
.deck-head .arw:hover{border-color:var(--neon-dim)}
.deck-head input[type=date]{flex:1;min-width:110px;background:#0A1524;border:2px solid var(--grid);border-radius:2px;
  color:var(--txt);font-family:var(--mono);font-size:13px;padding:11px 10px;color-scheme:dark}
.swipe-hint{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin:0 0 12px;opacity:.7}

.deck{position:relative;max-width:440px;margin:0 auto;min-height:540px;perspective:1600px}
.ghost{position:absolute;top:24px;bottom:24px;width:26px;border:2px solid var(--grid);border-radius:6px;
  background:linear-gradient(180deg,#0E1929,#0A1420);opacity:.55;pointer-events:none;z-index:0}
.ghost.prev{left:-14px}
.ghost.next{right:-14px}

.flip{position:relative;width:100%;trans-style:preserve-3d;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.4,.15,.2,1);z-index:2;touch-action:pan-y}
.flip.flipped{transform:rotateY(180deg)}
/* horizontal swipe: JS sets --dx; a class animates the fly-out */
.flip.dragging{transition:none}
.flip.fly-left{transition:transform .28s ease, opacity .28s ease;transform:translateX(-120%) rotate(-6deg);opacity:0}
.flip.fly-right{transition:transform .28s ease, opacity .28s ease;transform:translateX(120%) rotate(6deg);opacity:0}

.face{position:relative;-webkit-backface-visibility:hidden;backface-visibility:hidden;
  background:var(--panel);border:2px solid var(--grid);border-radius:8px;padding:18px 16px 16px;
  box-shadow:0 18px 40px -20px rgba(7,11,20,.95)}
.face.front{cursor:pointer}
.face.back{position:absolute;inset:0;transform:rotateY(180deg);overflow-y:auto}
.fday{text-align:center;font-family:var(--px);font-size:12px;color:var(--amber);margin-bottom:8px;letter-spacing:.02em}
.fday small{display:block;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:5px;letter-spacing:.04em;text-transform:none}
.fday .evt{color:var(--pink)}
.wprice{position:sticky;top:0;z-index:5;display:flex;align-items:baseline;justify-content:center;gap:12px;
  background:linear-gradient(180deg,var(--panel) 70%,rgba(17,28,46,.0));
  padding:6px 0 12px;margin:0 0 6px}
.wp-rate{font-family:var(--px);font-size:22px;color:var(--neon);text-shadow:0 0 18px rgba(53,208,255,.5)}
.wp-rate.bump{animation:bump .3s ease}
.wp-delta{font-family:var(--mono);font-size:12px;letter-spacing:.03em}

.flip-btn{width:100%;margin-top:16px;font-family:var(--px);font-size:9px;letter-spacing:.02em;cursor:pointer;
  color:var(--neon);background:transparent;border:2px solid var(--grid);border-radius:4px;padding:13px;transition:.15s}
.flip-btn:hover{border-color:var(--neon);background:rgba(53,208,255,.08)}

/* weights */
.wtot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 16px}
.wtot h4{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.04em;color:var(--neon)}
.wtot span.sum{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--void);background:var(--amber);padding:6px 9px;border-radius:2px}
.fac{margin-bottom:20px}
.fac .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fac .nm{font-family:var(--mono);font-size:12.5px;color:var(--txt);letter-spacing:.02em}
.fac .wv{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--amber);min-width:34px;text-align:right}
.fac .ds{font-size:12px;color:var(--dim);margin:2px 0 4px;line-height:1.45}
.fac .sig{font-family:var(--mono);font-size:11px;margin:0 0 4px}
.fac.na .nm,.fac.na .ds{opacity:.5}
.fac.na .wv{color:var(--dim)}
/* DJ-style faders: tall track, big grooved handle, easy to grab with a thumb. */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:52px;background:transparent;cursor:pointer;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:16px;background:#0A1524;border:1px solid var(--grid);border-radius:8px;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.55)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:44px;margin-top:-14px;
  background:
    repeating-linear-gradient(180deg, rgba(0,0,0,.34) 0 1px, transparent 1px 4px) center/22px 22px no-repeat,
    linear-gradient(180deg,#FFD873 0%,var(--amber) 46%,#E5A81E 54%,#B9791A 100%);
  border:1px solid #7A5A18;border-radius:7px;
  box-shadow:0 3px 6px rgba(0,0,0,.5), 0 0 14px rgba(255,197,66,.55), inset 0 0 0 2px rgba(0,0,0,.28);cursor:grab}
input[type=range]:active::-webkit-slider-thumb{cursor:grabbing;filter:brightness(1.08)}
input[type=range]::-moz-range-track{height:16px;background:#0A1524;border:1px solid var(--grid);border-radius:8px;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.55)}
input[type=range]::-moz-range-thumb{width:34px;height:44px;
  background:
    repeating-linear-gradient(180deg, rgba(0,0,0,.34) 0 1px, transparent 1px 4px) center/22px 22px no-repeat,
    linear-gradient(180deg,#FFD873 0%,var(--amber) 46%,#E5A81E 54%,#B9791A 100%);
  border:1px solid #7A5A18;border-radius:7px;
  box-shadow:0 3px 6px rgba(0,0,0,.5), 0 0 14px rgba(255,197,66,.55), inset 0 0 0 2px rgba(0,0,0,.28)}
.wactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.wactions .kbtn{width:100%}
.dirty{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--amber);margin-top:12px;text-align:center;min-height:14px}
.why-wrap{margin-top:16px;border-top:2px solid var(--grid);padding-top:14px}
.why-h{font-family:var(--px);font-size:10px;letter-spacing:.04em;color:var(--neon);margin-bottom:10px}
.why{list-style:none}
.why li{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;
  font-family:var(--mono);font-size:12px;padding:8px 0;border-bottom:1px dashed var(--grid);color:var(--dim)}
.why li b{font-family:var(--px);font-size:9px}
.why li.head,.why li.tot{color:var(--txt)}
.why li.tot{border-bottom:0;border-top:2px solid var(--grid);padding-top:12px}
.why li.tot b{color:var(--neon);font-size:10px}
.why li.muted{opacity:.55}
.why .cbar{grid-column:1/-1;height:6px;background:#0A1524;border:1px solid var(--grid);border-radius:2px;overflow:hidden}
.why .cbar i{display:block;height:100%;transition:width .4s ease}

/* readout */
.readout{text-align:center;padding:6px 10px 16px;border-bottom:2px solid var(--grid);margin-bottom:16px}
.readout .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.readout .rate{font-family:var(--px);font-size:clamp(30px,9vw,44px);color:var(--neon);margin:12px 0 8px;
  text-shadow:0 0 22px rgba(53,208,255,.55)}
.readout .rate.bump{animation:bump .35s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.readout .delta{font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 4px;text-align:left}
.kpi{background:#0A1524;border:2px solid var(--grid);border-radius:3px;padding:9px 10px}
.kpi .kl{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.kpi .kv{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--txt);margin:5px 0 2px;line-height:1.35}
.kpi .kd{font-family:var(--mono);font-size:11px}
.kpi.wide{grid-column:1/-1}
.kpi .rankbar{display:flex;gap:2px;margin-top:5px}
.kpi .rankbar i{flex:1;height:6px;border-radius:1px;background:var(--grid)}
.kpi .rankbar i.lo{background:var(--green)}
.kpi .rankbar i.me{background:var(--neon);box-shadow:0 0 8px rgba(53,208,255,.7)}
.up{color:var(--green)}.down{color:var(--pink)}.flat{color:var(--dim)}

.acc{margin-top:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.ovr{display:flex;align-items:center;gap:6px;background:#0A1524;border:2px solid var(--grid);border-radius:3px;padding:4px 6px}
.ovr-lbl{font-size:13px}
.ovr input{width:82px;background:transparent;border:0;color:var(--txt);font-family:var(--mono);font-size:14px;padding:8px 4px}
.ovr input:focus{outline:none}
.ovr input::-webkit-outer-spin-button,.ovr input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.note{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:12px;line-height:1.6;text-align:center}

.err{font-family:var(--mono);font-size:12px;color:var(--pink);padding:14px 0;line-height:1.6}
.boot{font-family:var(--px);font-size:11px;color:var(--dim);padding:60px 0;text-align:center}

@media (max-width:880px){
  .deck{min-height:0}
  .swipe-hint{margin-bottom:10px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .flip{transition:none}
}
</style>
</head>

<div class="crt" aria-hidden="true"></div>

<header class="hud">
  <div class="shell hud-in">
    <a class="logo" id="home-link" href="index.html">RMES <b>//</b> PRICING<br><b>CONSOLE</b></a>
    <div class="hud-right">
      <span class="cloud" id="rmes-cloud-status">⚠ local only</span>
    </div>

<script>
/* Small screens go back to the mobile app, big screens to the full dashboard. */
(function(){
  var uaMob = /Mobi|Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent || '');
  var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  var mob = uaMob || (isTouch && window.matchMedia('(max-width: 1024px)').matches) || window.matchMedia('(max-width: 880px)').matches;
  var target = mob ? 'app.html' : 'index.html';
  var back = document.getElementById('back-link');
  if (back){ back.href = target; back.textContent = (mob ? '◂ RMES Mobile' : '◂ Dashboard'); }
  var home = document.getElementById('home-link');
  if (home) home.href = target;
})();
</script>

<main class="shell">
  <div id="boot" class="boot">Loading data…</div>

  <div id="app" style="display:none">
    <div class="bar" id="struct-pills"></div>

    <div class="deck-head">
      <button class="arw" id="d-prev" aria-label="Previous day">&#9664;</button>
      <input type="date" id="d-date" aria-label="Stay date">
      <button class="arw" id="d-next" aria-label="Next day">&#9654;</button>
      <button class="arw" id="d-today" aria-label="Today" title="Today">&#9679;</button>
    </div>
    <div class="swipe-hint" id="swipe-hint">‹ swipe · tap to flip · swipe ›</div>

      <div class="ghost prev" id="ghost-prev"></div>

        <div class="face front" id="face-front">
          <div class="fday" id="f-day"></div>
          <div class="readout">
            <div class="lbl">Recommended rate</div>

            <div class="delta flat" id="delta">—</div>
          </div>
          <div class="kpis" id="kpis"></div>
          <div class="acc" id="acc-box">
            <button class="kbtn" id="accept">✓ Accept</button>
            <div class="ovr">
              <span class="ovr-lbl">🖋</span>
              <input type="number" id="ovr-price" min="0" step="1" inputmode="numeric" placeholder="own price" aria-label="Manual price for this day">
              <button class="kbtn amber sm" id="ovr-set">Set</button>
            </div>
            <button class="kbtn alt sm" id="unaccept">Clear</button>
          </div>
          <p class="note" id="note"></p>
          <button class="flip-btn" id="to-weights" type="button">Adjust weights ⟳</button>
        </div>

        <!-- ============ BACK: weights ============ -->
        <div class="face back" id="face-back">
          <div class="fday" id="b-day"></div>
          <div class="wprice" id="wprice">
            <span class="wp-rate" id="wp-rate">—</span>
            <span class="wp-delta flat" id="wp-delta"></span>
          </div>
          <div class="wtot">
            <h4 style="margin:0">Factor weights</h4>
            <span class="sum" id="wsum">100 / 100</span>
          </div>
          <div id="facs"></div>
          <div class="wactions">
            <button class="kbtn amber sm" id="w-day">Apply to this day</button>
            <button class="kbtn alt sm" id="w-week">Apply to 7 days</button>
            <button class="kbtn alt sm" id="w-clear">Property default</button>
            <button class="kbtn alt sm" id="w-default">Set as default</button>
          </div>
          <span class="dirty" id="w-dirty"></span>
          <div class="why-wrap">
            <h4 class="why-h">Why this rate</h4>
            <ul class="why" id="why"></ul>
          </div>
          <button class="flip-btn" id="to-front" type="button">⟳ Back to price</button>
        </div>
      </div>
    </div>
  </div>
</main>

<nav class="botbar" id="botbar">
  <a class="botlink" id="back-link" href="index.html">◂ Dashboard</a>
</nav>

<script src="engine.js"></script>
<script>
/* ===========================================================================
   RMES PRICING CONSOLE
   Standalone arcade-style console on top of the live RMES engine.
   - Weights are PER DAY. Moving a slider is a sandbox: nothing is stored until
     you press "Apply to this day" (or "Apply to 7 days"). A day with no weights
     of its own falls back to the property default (the RMES tab).
   - Everything else (factor multipliers, LMF, Event, Promo, Floor, Base Price,
     Last update) is read from the real engine (computeRMESPriceMap), so the
     numbers match Sell Strategy and Export Pricing.
   =========================================================================== */
(function(){
  'use strict';

  /* Slider key → RMES factor. The storage keys are historical:
     'airdna' drives D·Demand (Expedia searches) and 'mkt' drives E·AirDNA Market. */
  var FACTORS = [
    { k:'occ',    mult:'occ_mult',  na:'occ',   label:'Daily Pickup',  ds:'Rooms sold today vs the expected fill rate' },
    { k:'pace',   mult:'pace_mult', na:'pace',  label:'Pace Trend',    ds:'Booking pace vs the same point last year' },
    { k:'comp',   mult:'comp_mult', na:'comp',  label:'Online Pricing',ds:'My price vs the weighted Expedia comp set' },
    { k:'airdna', mult:'air_mult',  na:'air',   label:'Demand',        ds:'Expedia searches vs the monthly median' },
    { k:'mkt',    mult:'mkt_mult',  na:'mkt',   label:'AirDNA Market', ds:'Market occupancy vs mine — headroom signal' }
  ];
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  var S = {
    struct: 'firenze',
    ymd: null,          // selected stay date (YYYYMMDD number)
    w: {},              // sandbox weights, integers summing to 100
    saved: {},          // weights currently stored FOR THIS DAY (override, or property default)
    day: null,          // engine snapshot for the selected day
    lastRate: null
  };
  var MAPS = {};        // struct → computeRMESPriceMap result (cached)

  /* ---------- date helpers ---------- */
  function todayYmd(){ var d=new Date(); d.setHours(0,0,0,0); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
  function ymdToDate(n){ return new Date(Math.floor(n/10000), Math.floor((n%10000)/100)-1, n%100); }
  function dateToYmd(d){ return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
  function addDaysYmd(n, k){ var d=ymdToDate(n); d.setDate(d.getDate()+k); return dateToYmd(d); }
  function ymdToIso(n){ var s=String(n); return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8); }
  function isoToYmd(s){ return parseInt(s.replace(/-/g,''),10); }
  function eur(n){ return isFinite(n) ? '€'+Math.round(n) : '—'; }
  function eur1(n){ return (n>=0?'+':'−')+'€'+Math.abs(n).toFixed(1); }

  /* ---------- weights: sandbox <-> stored ---------- */
  /* The weights that actually apply to a stay-date: day override if any, else the
     property default. Returned as five integers adding up to 100. */
  function effectiveWeightsPct(sel, ymd){
    var src = (typeof getWeightsFor === 'function') ? getWeightsFor(sel, ymd) : null;
    if (!src && typeof SELL_RMES_W_ALL !== 'undefined') src = SELL_RMES_W_ALL[sel];
    var raw = FACTORS.map(function(f){ return (src && isFinite(src[f.k])) ? src[f.k] : 0.20; });
    var tot = raw.reduce(function(a,b){ return a+b; }, 0) || 1;
    var pct = raw.map(function(v){ return v/tot*100; });
    // largest-remainder rounding so the five integers add up to exactly 100
    var out = pct.map(function(v){ return Math.floor(v); });
    var rest = 100 - out.reduce(function(a,b){ return a+b; }, 0);
    var order = pct.map(function(v,i){ return { i:i, f:v-Math.floor(v) }; })
                   .sort(function(a,b){ return b.f-a.f; });
    for (var j=0; j<rest; j++) out[order[j % order.length].i]++;
    var o = {};
    FACTORS.forEach(function(f,i){ o[f.k] = out[i]; });
    return o;
  }
  function fractions(w){
    var o = {};
    FACTORS.forEach(function(f){ o[f.k] = w[f.k] / 100; });
    return o;
  }
  function weightsEqual(a,b){ return FACTORS.every(function(f){ return a[f.k] === b[f.k]; }); }
  function isDirty(){ return !weightsEqual(S.w, S.saved); }
  function dayIsCustom(){ return (typeof hasDayWeights === 'function') ? hasDayWeights(S.struct, S.ymd) : false; }

  /* Keep the five weights adding up to exactly 100 (same logic as the RMS Lab prototype). */
  function normalize(movedKey){
    var v = Math.round(S.w[movedKey]);
    if (v > 100) v = 100;
    if (v < 0) v = 0;
    S.w[movedKey] = v;
    var rest = 100 - v;
    var others = FACTORS.map(function(f){ return f.k; }).filter(function(k){ return k !== movedKey; });
    var othersSum = others.reduce(function(a,k){ return a + S.w[k]; }, 0);
    if (othersSum <= 0){
      var each = Math.floor(rest / others.length);
      others.forEach(function(k){ S.w[k] = each; });
    } else {
      others.forEach(function(k){ S.w[k] = Math.round(S.w[k] / othersSum * rest); });
    }
    var total = FACTORS.reduce(function(a,f){ return a + S.w[f.k]; }, 0);
    if (total !== 100 && others.length){
      var big = others[0];
      others.forEach(function(k){ if (S.w[k] > S.w[big]) big = k; });
      S.w[big] += 100 - total;
      if (S.w[big] < 0) S.w[big] = 0;
    }
  }

  /* ---------- engine bridge ---------- */
  function priceMap(sel){
    if (MAPS[sel]) return MAPS[sel];
    CURRENT_STRUCT = sel;                       // computeRMESPriceMap reads the current struct
    if (typeof fp_ensureStruct === 'function') fp_ensureStruct(sel);
    MAPS[sel] = computeRMESPriceMap(sel, todayYmd(), 365);
    return MAPS[sel];
  }
  function invalidate(){ MAPS = {}; if (typeof _invalidateRmesMapCache === 'function') _invalidateRmesMapCache(); }

  /* Everything the console needs for one stay date. Weight-independent. */
  function dayData(sel, ymd){
    var map = priceMap(sel);
    var dd = map[ymd];
    var baseRT = (CFG.structures[sel] && CFG.structures[sel].baseRT) || null;
    if (!dd || !baseRT || !dd.multsByRT || !dd.multsByRT[baseRT]) return null;
    var m = dd.multsByRT[baseRT];
    var naR = m._naReasons || {};
    var mults = {}, na = {};
    FACTORS.forEach(function(f){
      mults[f.k] = (m[f.mult] != null && isFinite(m[f.mult])) ? m[f.mult] : 1;
      na[f.k] = naR[f.na] || null;
    });
    var effBase = (typeof newrmesGetEffectiveBase === 'function') ? newrmesGetEffectiveBase(sel, ymd) : null;
    var lastUpdate = (typeof newrmesGetCurrentReference === 'function') ? newrmesGetCurrentReference(sel, ymd) : null;
    var accMeta = (typeof newrmesGetAcceptedMeta === 'function') ? newrmesGetAcceptedMeta(sel, ymd) : null;
    var iso = ymdToIso(ymd);
    var ovr = (typeof fp_getOverride === 'function') ? fp_getOverride(sel, iso, baseRT) : null;
    if (ovr && (ovr.price == null || !isFinite(ovr.price))) ovr = null;
    // Which decision is actually loaded today: most recent between override 🖋 and accept ✓
    var accTs = (accMeta && accMeta.ts) ? (Date.parse(accMeta.ts) || 0) : 0;
    var ovrTs = (ovr && ovr.savedAt) ? (Date.parse(ovr.savedAt) || 0) : 0;
    var source = 'base';
    if (ovr && accMeta && accMeta.price != null) source = (accTs > ovrTs) ? 'accepted' : 'override';
    else if (ovr) source = 'override';
    else if (accMeta && accMeta.price != null) source = 'accepted';
    var lmf = 0;
    if (typeof fp_lmfLookup === 'function'){
      var days = Math.max(0, Math.round((ymdToDate(ymd).getTime() - ymdToDate(todayYmd()).getTime())/86400000));
      try { lmf = fp_lmfLookup(sel, (dd.curOcc != null ? dd.curOcc : 0), days); } catch(e){ lmf = 0; }
    }
    var promo = 1;
    try { if (typeof _getPromoBoost === 'function') promo = _getPromoBoost(sel, ymd).boost; } catch(e){}
    return {
      ymd: ymd,
      iso: iso,
      baseRT: baseRT,
      mults: mults,
      na: na,
      effBase: (effBase != null && isFinite(effBase)) ? effBase : null,
      lastUpdate: (lastUpdate != null && isFinite(lastUpdate)) ? lastUpdate : null,
      accepted: (accMeta && accMeta.price != null) ? accMeta : null,
      override: ovr,
      source: source,
      lmf: isFinite(lmf) ? lmf : 0,
      event: (typeof _getEventBoost === 'function') ? _getEventBoost(ymd) : 1,
      eventName: (typeof EVENTS !== 'undefined' && EVENTS[ymd]) ? EVENTS[ymd] : null,
      promo: isFinite(promo) ? promo : 1,
      floor: (typeof fp_getFloor === 'function') ? fp_getFloor(sel) : 0,
      cap: (typeof getRmesCap === 'function') ? getRmesCap(sel) : 0.30,
      occ: (dd.curOcc != null) ? dd.curOcc : 0,
      curRn: dd.curRn || 0,
      rooms: dd.cap || 0,
      stats: dayStats(sel, ymd),
      rank: dayRank(sel, ymd, m, baseRT),
      pickup: dayPickup(sel, ymd)
    };
  }

  /* Room-nights booked in the last 7 days for this stay date, vs the same
     window one year ago. Straight from the engine helper. */
  function dayPickup(sel, ymd){
    try {
      if (typeof pickup7dForStay !== 'function') return null;
      var p = pickup7dForStay(sel, ymd);
      return { cur: p.cur, stly: p.stly };
    } catch(e){ return null; }
  }

  /* OTB occupancy/ADR and the same-day-last-year figures, straight from the
     Sell Strategy aggregator (so they match the dashboard row for row). */
  function dayStats(sel, ymd){
    try {
      var A = aggSellStrategy(sel, ymd, 1, 0);
      if (A && A.rows && A.rows.length){
        var r = A.rows.find(function(x){ return x.ymd === ymd; }) || A.rows[0];
        return {
          curOcc:  isFinite(r.curOcc)  ? r.curOcc  : null,
          stlyOcc: isFinite(r.stlyOcc) ? r.stlyOcc : null,
          curAdr:  (isFinite(r.curAdr)  && r.curRn  > 0) ? r.curAdr  : null,
          stlyAdr: (isFinite(r.stlyAdr) && r.stlyRn > 0) ? r.stlyAdr : null,
          curRn:   r.curRn || 0, stlyRn: r.stlyRn || 0, cap: r.cap || 0
        };
      }
    } catch(e){}
    return null;
  }
  /* Where the suggested price sits among the competitors, in Expedia space.
     Reuses the dashboard's own rank helper so the number is identical. */
  function dayRank(sel, ymd, m, baseRT){
    try {
      if (typeof _sellCompRank !== 'function') return null;
      var sugg = (m && m.rmesSugg != null) ? m.rmesSugg : null;
      var map = priceMap(sel), dd = map[ymd];
      var suggBase = (dd && dd.rmesSuggestedByRT && dd.rmesSuggestedByRT[baseRT] != null)
        ? dd.rmesSuggestedByRT[baseRT] : (dd ? dd.price : null);
      if (suggBase == null) return null;
      var div = (typeof fp_expToBeddyDivisor === 'function') ? fp_expToBeddyDivisor(sel) : 1;
      var myExp = suggBase * (div || 1);
      var iso = ymdToIso(ymd);
      var rk = _sellCompRank(sel, iso, myExp);
      if (!rk) return null;
      return { rank: rk.rank, total: rk.total, myExp: myExp };
    } catch(e){ return null; }
  }

  /* The RMES formula, recomposed with the sandbox weights.
     Base × Composite × (1 + LMF%) × Event × Promo, floored.
     Factors flagged n/d for the day carry zero weight; the rest are renormalised —
     exactly what the engine does in _normalizeWeights(). */
  function compute(day, w){
    var active = FACTORS.filter(function(f){ return !day.na[f.k]; });
    var activeSum = active.reduce(function(a,f){ return a + w[f.k]; }, 0);
    var wNorm = {};
    FACTORS.forEach(function(f){ wNorm[f.k] = (activeSum > 0 && !day.na[f.k]) ? w[f.k]/activeSum : 0; });

    var rawDev = FACTORS.reduce(function(a,f){ return a + wNorm[f.k] * (day.mults[f.k] - 1); }, 0);
    var cap = day.cap;
    var hitCap = Math.abs(rawDev) > cap;
    var dev = Math.max(-cap, Math.min(cap, rawDev));
    var composite = 1 + dev;
    var scale = (rawDev !== 0) ? dev / rawDev : 1;   // keep the € breakdown adding up after the cap

    var base = day.effBase;
    var afterFactors = base * composite;
    var afterLmf = afterFactors * (1 + day.lmf/100);
    var afterEvent = afterLmf * day.event;
    var afterPromo = afterEvent * day.promo;
    var atFloor = afterPromo < day.floor;
    var price = atFloor ? day.floor : afterPromo;

    var contrib = {};
    FACTORS.forEach(function(f){ contrib[f.k] = base * wNorm[f.k] * (day.mults[f.k] - 1) * scale; });

    return {
      price: price, composite: composite, hitCap: hitCap, atFloor: atFloor,
      wNorm: wNorm, contrib: contrib,
      lmfEur: afterLmf - afterFactors,
      eventEur: afterEvent - afterLmf,
      promoEur: afterPromo - afterEvent,
      floorEur: atFloor ? (day.floor - afterPromo) : 0
    };
  }

  /* ---------- render ---------- */

    }).join('');

  function renderFactors(){

    });
    var tot = FACTORS.reduce(function(a,f){ return a + S.w[f.k]; }, 0);
    document.getElementById('wsum').textContent = tot + ' / 100';

    var custom = dayIsCustom();
    var msg;
    if (isDirty()) msg = '● unsaved — this day still uses ' + (custom ? 'its saved weights' : 'the property default');

    document.getElementById('w-day').disabled = !isDirty();

  function pctPts(cur, ly){

  }
  function pctChg(cur, ly){

  }
  function vsTag(v, unit){

  function renderKpis(day){

  function renderOutput(){
    var rateEl = document.getElementById('rate');

    }

    // Why this rate
    var rows = [];
    rows.push({ cls:'head', label:'Base Price', sub:'structural, per day', eurv:null, txt:eur(day.effBase) });
    var maxAbs = Math.max.apply(null, FACTORS.map(function(f){ return Math.abs(r.contrib[f.k]); }).concat([0.01]));
    FACTORS.forEach(function(f){
      var na = day.na[f.k];
      rows.push({
        cls: na ? 'muted' : '',
        label: f.label,
        sub: na ? 'no signal' : (S.w[f.k] + '% × ' + ((day.mults[f.k]-1)*100).toFixed(1) + '%'),
        eurv: na ? 0 : r.contrib[f.k],
        bar: na ? 0 : Math.abs(r.contrib[f.k]) / maxAbs * 100
      });
    });
    if (Math.abs(r.lmfEur) > 0.05) rows.push({ label:'Last-Minute Factor', sub:day.lmf.toFixed(1)+'%', eurv:r.lmfEur, bar:Math.abs(r.lmfEur)/maxAbs*100 });
    if (Math.abs(r.eventEur) > 0.05) rows.push({ label:'Event Factor', sub:(day.eventName||'event')+' · '+((day.event-1)*100).toFixed(0)+'%', eurv:r.eventEur, bar:Math.abs(r.eventEur)/maxAbs*100 });
    if (Math.abs(r.promoEur) > 0.05) rows.push({ label:'Promo', sub:((day.promo-1)*100).toFixed(0)+'%', eurv:r.promoEur, bar:Math.abs(r.promoEur)/maxAbs*100 });
    if (r.atFloor) rows.push({ label:'Floor Rate', sub:'clamped at '+eur(day.floor), eurv:r.floorEur, bar:Math.abs(r.floorEur)/maxAbs*100 });

    var h = '';
    rows.forEach(function(x){
      var val = (x.eurv == null) ? x.txt : eur1(x.eurv);
      var pos = (x.eurv == null) ? true : (x.eurv >= 0);

      h += '<li class="'+(x.cls||'')+'">'+
             '<span>'+x.label+' <small style="opacity:.65">· '+x.sub+'</small></span>'+
             '<b class="'+cls+'">'+val+'</b>';
      if (x.bar != null && x.bar > 0){
        h += '<span class="cbar"><i style="width:'+x.bar.toFixed(0)+'%;background:'+(pos?'var(--green)':'var(--pink)')+'"></i></span>';
      }
      h += '</li>';
    });
    h += '<li class="tot"><span>Recommended rate</span><b>'+eur(r.price)+'</b></li>';
    if (whyEl) whyEl.innerHTML = h;

    var notes = [];
    notes.push('Composite ×'+r.composite.toFixed(3)+(r.hitCap ? ' (capped at ±'+Math.round(day.cap*100)+'%)' : ''));
    function when(ts){ return ts ? ts.slice(0,10).split('-').reverse().join('/') : '—'; }
    if (day.source === 'override'){
      notes.push('🖋 Manual price ' + eur(day.override.price) + ' set on ' + when(day.override.savedAt) +
                 (day.override.author ? ' by ' + day.override.author : ''));
    } else if (day.source === 'accepted'){
      notes.push('✓ Accepted ' + eur(day.accepted.price) + ' on ' + when(day.accepted.ts) +
                 (day.accepted.author ? ' by ' + day.accepted.author : ''));
    } else {
      notes.push('No decision yet — the Base Price is what is loaded today');
    }
    if (isDirty()) notes.push('⚠ Weights not saved for this day yet');
    else if (dayIsCustom()) notes.push('★ Custom weights for this day');
    noteEl.textContent = notes.join(' · ');

    var ovrInput = document.getElementById('ovr-price');
    if (document.activeElement !== ovrInput){
      ovrInput.value = (day.source === 'override') ? Math.round(day.override.price) : '';
    }
    ovrInput.placeholder = 'own price';
    document.getElementById('accept').disabled = false;
    document.getElementById('unaccept').disabled = (day.source === 'base');
  }

  function renderAll(){
    S.day = dayData(S.struct, S.ymd);
    S.saved = effectiveWeightsPct(S.struct, S.ymd);   // weights stored for THIS day
    S.w = Object.assign({}, S.saved);                 // sandbox starts from them
    // always land on the price face when the day changes
    document.getElementById('flip').classList.remove('flipped');
    renderMeta();
    renderGhosts();
    renderFactors();
    renderOutput();
  }
  function setDay(ymd, dir){
    var min = todayYmd(), max = addDaysYmd(min, 364);
    if (ymd < min) ymd = min;
    if (ymd > max) ymd = max;
    if (ymd === S.ymd){ animateSnapBack(); return; }
    S.ymd = ymd;
    if (dir){
      // fly the current card out, then bring the new one in from the opposite side
      var flip = document.getElementById('flip');
      flip.classList.remove('dragging');
      flip.classList.add(dir < 0 ? 'fly-left' : 'fly-right');
      setTimeout(function(){
        flip.style.transform = '';
        flip.classList.remove('fly-left','fly-right');
        var inFrom = dir < 0 ? 120 : -120;
        flip.style.transition = 'none';
        flip.style.transform = 'translateX(' + inFrom + '%)';
        renderAll();
        void flip.offsetWidth;
        flip.style.transition = '';
        flip.style.transform = '';
      }, 240);
    } else {
      renderAll();
    }
  }
  function animateSnapBack(){
    var flip = document.getElementById('flip');
    flip.classList.remove('dragging');
    flip.style.transform = flip.classList.contains('flipped') ? 'rotateY(180deg)' : '';
  }

  /* ---------- swipe (Tinder-style) ---------- */
  function wireSwipe(){
    var flip = document.getElementById('flip');
    var x0 = null, y0 = null, dx = 0, dragging = false, decided = false;
    function start(x, y){
      // Swipe changes the day ONLY on the price face. On the weights face,
      // dragging must stay inside the sliders and never move the card.
      if (document.getElementById('flip').classList.contains('flipped')) { dragging = false; return; }
      x0 = x; y0 = y; dx = 0; dragging = true; decided = false;
    }
    function move(x, y){
      if (!dragging) return false;
      var ax = x - x0, ay = y - y0;
      if (!decided){
        if (Math.abs(ax) < 8 && Math.abs(ay) < 8) return false;
        decided = true;
        if (Math.abs(ay) > Math.abs(ax)){ dragging = false; return false; } // vertical → let it scroll
        flip.classList.add('dragging');
      }
      dx = ax;
      flip.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx*0.02) + 'deg)';
      return true;
    }
    function end(){
      if (!dragging){ return; }
      dragging = false;
      flip.classList.remove('dragging');
      var min = todayYmd(), max = addDaysYmd(min, 364);
      if (dx <= -60 && S.ymd < max){ hideHint(); setDay(addDaysYmd(S.ymd, 1), +1); }
      else if (dx >= 60 && S.ymd > min){ hideHint(); setDay(addDaysYmd(S.ymd, -1), -1); }
      else { animateSnapBack(); }
      dx = 0;
    }
    flip.addEventListener('touchstart', function(e){ start(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
    flip.addEventListener('touchmove', function(e){ if (move(e.touches[0].clientX, e.touches[0].clientY)) e.preventDefault(); }, {passive:false});
    flip.addEventListener('touchend', end);
    // mouse (desktop) drag
    flip.addEventListener('mousedown', function(e){ if (e.target.closest('input,button,.acc')) return; start(e.clientX, e.clientY);
      var mm = function(ev){ move(ev.clientX, ev.clientY); }, mu = function(){ end(); document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); };
      document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
    });
  }

  function doFlip(toBack){
    var flip = document.getElementById('flip');
    flip.style.transform = '';
    flip.classList.toggle('flipped', toBack);
  }
  var _hintGone = false;
  function hideHint(){
    if (_hintGone) return; _hintGone = true;
    var el = document.getElementById('swipe-hint');
    if (el){ el.style.transition = 'opacity .4s'; el.style.opacity = '0'; setTimeout(function(){ el.style.display = 'none'; }, 400); }
  }

  /* ---------- actions ---------- */
  function wireActions(){
    document.getElementById('d-prev').addEventListener('click', function(){ setDay(addDaysYmd(S.ymd, -1), -1); });
    document.getElementById('d-next').addEventListener('click', function(){ setDay(addDaysYmd(S.ymd, 1), +1); });
    document.getElementById('d-today').addEventListener('click', function(){ setDay(todayYmd()); });
    document.getElementById('d-date').addEventListener('change', function(e){
      var v = isoToYmd(e.target.value);
      if (isFinite(v)) setDay(v); else renderMeta();
    });

    // flip: tap the front card, or use the labelled buttons
    document.getElementById('face-front').addEventListener('click', function(e){
      if (e.target.closest('input,button,.acc,.ovr')) return;
      doFlip(true);
    });
    document.getElementById('to-weights').addEventListener('click', function(e){ e.stopPropagation(); doFlip(true); });
    document.getElementById('to-front').addEventListener('click', function(){ doFlip(false); });
    wireSwipe();

    document.getElementById('w-day').addEventListener('click', function(){
      setDayWeights(S.struct, S.ymd, fractions(S.w));
      invalidate();
      renderAll();
    });

    document.getElementById('w-week').addEventListener('click', function(){
      var to = addDaysYmd(S.ymd, 6);
      if (!confirm('Apply these weights to the 7 days from ' + ymdToIso(S.ymd).split('-').reverse().join('/') +
                   ' to ' + ymdToIso(to).split('-').reverse().join('/') + '?')) return;
      setDayWeightsRange(S.struct, S.ymd, to, fractions(S.w));
      invalidate();
      renderAll();
    });

    document.getElementById('w-clear').addEventListener('click', function(){
      if (!dayIsCustom()) return;
      if (!confirm('Drop the custom weights for this day and go back to the property default?')) return;
      clearDayWeights(S.struct, S.ymd);
      invalidate();
      renderAll();
    });

    document.getElementById('w-default').addEventListener('click', function(){
      if (!confirm('Make these the default weights for ' + (CFG.structures[S.struct].label || S.struct) +
                   '?\nEvery day without custom weights will use them — here and in the dashboard.')) return;
      var cur = SELL_RMES_W_ALL[S.struct] || {};
      SELL_RMES_W_ALL[S.struct] = Object.assign({}, cur, fractions(S.w), { price: 0, budget: 0 });
      saveRmesWeights();                    // → localStorage → Firebase push
      invalidate();
      renderAll();
    });

    document.getElementById('accept').addEventListener('click', function(e){
      e.stopPropagation();
      if (!S.day || S.day.effBase == null) return;
      var r = compute(S.day, S.w);
      var price = Math.round(r.price);
      if (isDirty() && !confirm('The weights you moved are not saved for this day.\nAccept ' + eur(price) + ' anyway? (the rate is stored, the weights are not)')) return;
      newrmesSetAccepted(S.struct, S.ymd, price);
      invalidate();
      renderAll();
    });

    document.getElementById('ovr-set').addEventListener('click', function(e){
      e.stopPropagation();
      if (!S.day || S.day.effBase == null) return;
      var v = parseFloat(document.getElementById('ovr-price').value);
      if (!isFinite(v) || v <= 0){ alert('Type the price you want to load for this day.'); return; }
      var floor = S.day.floor;
      if (v < floor && !confirm(eur(v) + ' is below the Floor Rate (' + eur(floor) + ').\nLoad it anyway?')) return;
      // 🖋 manual price for the day — same key the dashboard writes (rmes_base_rate_overrides_v1)
      fp_setOverride(S.struct, S.day.iso, S.day.baseRT, Math.round(v));
      invalidate();
      renderAll();
    });

    document.getElementById('ovr-price').addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); document.getElementById('ovr-set').click(); }
    });
    document.getElementById('ovr-price').addEventListener('click', function(e){ e.stopPropagation(); });

    document.getElementById('unaccept').addEventListener('click', function(e){
      e.stopPropagation();
      if (!S.day || S.day.source === 'base') return;
      if (!confirm('Clear the decision for this day and go back to the Base Price?')) return;
      if (S.day.accepted) newrmesSetAccepted(S.struct, S.ymd, null);
      if (S.day.override && typeof fp_setOverride === 'function') fp_setOverride(S.struct, S.day.iso, S.day.baseRT, null);
      invalidate();
      renderAll();
    });
  }

  /* ---------- boot ---------- */
  function boot(){
    try {
      loadData(EMBEDDED_CSV);
      if (typeof AIRDNA_CSV !== 'undefined') loadAirdna(AIRDNA_CSV);
      if (typeof EVENTS_CSV !== 'undefined') loadEvents(EVENTS_CSV);
      if (typeof ensureUserProfile === 'function') ensureUserProfile();

      S.struct = 'firenze';
      S.ymd = todayYmd();

      document.getElementById('boot').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      renderPills();
      wireActions();
      renderAll();
      window.__CONSOLE_BOOTED = true;
    } catch(e){
      console.error(e);
      document.getElementById('boot').innerHTML = '<div class="err">Data failed to load: ' + escapeHtml(e.message) + '</div>';
    }
  }

  /* A colleague accepted a price or changed the weights on another device →
     rebuild from the fresh localStorage state. The sandbox is left alone. */
  window.rmesCloudOnRemoteUpdate = function(){
    if (!window.__CONSOLE_BOOTED) return;
    if (typeof BOOKINGS === 'undefined' || !BOOKINGS || !BOOKINGS.length) return;
    try {
      invalidate();
      renderAll();
    } catch(e){ console.warn(e); }
  };

  document.addEventListener('DOMContentLoaded', function(){
    if (typeof RMES_CLOUD !== 'undefined' && RMES_CLOUD.init) RMES_CLOUD.init().then(boot).catch(boot);
    else boot();
  });
})();
</script>
