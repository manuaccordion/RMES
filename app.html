<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#d2691e">
<title>RMES Mobile — Revenue Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --org:#d2691e; --org-deep:#a8521a; --org-soft:#f3a259; --org-tint:#fbe9d8; --org-tint2:#f7d9bf;
  --bg:#fdf6ef; --card:#fffdfa; --ink:#2a1d12; --muted:#9a8470; --line:#f0e2d3;
  --up:#3d7a4b; --down:#c0492f; --flat:#9a8470;
  --shadow:0 1px 3px rgba(120,70,20,.07),0 6px 20px rgba(120,70,20,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3{font-family:'Playfair Display',serif;font-weight:600;letter-spacing:-.01em;margin:0}
.mono{font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:74px}

.app-head{position:sticky;top:0;z-index:30;
  background:linear-gradient(135deg,var(--org) 0%,var(--org-deep) 100%);
  padding:16px 18px 14px;color:#fff;box-shadow:0 2px 12px rgba(168,82,26,.25)}
.app-title{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;display:flex;align-items:center;gap:9px}
.app-title .dot{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.app-title .lite{font-weight:400;opacity:.85;font-size:14px}
.app-sub{font-size:11px;opacity:.9;font-family:'DM Mono',monospace;margin-top:3px;letter-spacing:.02em}

.struct-row{display:flex;gap:7px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.struct-row::-webkit-scrollbar{display:none}
.spill{flex:0 0 auto;padding:8px 15px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);
  font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;transition:all .15s;box-shadow:var(--shadow)}
.spill.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--org),var(--org-deep));box-shadow:0 3px 10px rgba(168,82,26,.3)}

.cal-wrap{padding:8px 16px 2px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.cal-month{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:var(--org-deep)}
.cal-nav{display:flex;gap:6px}
.cal-btn{width:34px;height:34px;border-radius:10px;background:var(--card);border:1.5px solid var(--org-tint2);
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--org);box-shadow:var(--shadow);font-weight:700}
.cal-btn:active{transform:scale(.94)}
.cal-btn.today-btn{width:auto;padding:0 13px;font-size:12px;font-weight:700;font-family:'DM Sans'}
.cal-strip{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.cal-strip::-webkit-scrollbar{display:none}
.cal-day{flex:0 0 auto;width:46px;padding:8px 0;border-radius:12px;background:var(--card);border:1.5px solid var(--line);
  text-align:center;box-shadow:var(--shadow);transition:all .12s}
.cal-day .dow{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:600;letter-spacing:.03em}
.cal-day .dnum{font-family:'DM Mono',monospace;font-size:16px;font-weight:500;margin-top:1px}
.cal-day.sel{border-color:transparent;color:#fff;background:linear-gradient(135deg,var(--org),var(--org-deep))}
.cal-day.sel .dow{color:rgba(255,255,255,.9)}
.cal-day.is-today .dnum{position:relative}
.cal-day.is-today .dnum::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:currentColor}
.cal-day.wknd:not(.sel){background:var(--org-tint)}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;
  background:rgba(255,253,250,.94);backdrop-filter:blur(12px);border-top:1px solid var(--org-tint2);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tabbar-inner{display:flex;gap:4px;max-width:480px;width:100%;padding:0 16px}
.tabbtn{flex:1;padding:8px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);transition:all .15s}
.tabbtn .ico{font-size:18px;line-height:1}
.tabbtn.active{color:var(--org);background:var(--org-tint)}

main{flex:1;padding:8px 16px 24px}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--org-deep);margin:14px 2px 8px}

.day-card{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);
  border-radius:16px;padding:14px 16px;margin-bottom:9px;box-shadow:var(--shadow);transition:all .12s;position:relative;overflow:hidden}
.day-card:active{transform:scale(.985)}
.day-card .edge{position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--org-soft),var(--org))}
.day-card .date-blk{flex:0 0 auto;text-align:center;min-width:46px}
.day-card .date-blk .dc-dow{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.03em}
.day-card .date-blk .dc-day{font-family:'Playfair Display',serif;font-size:24px;font-weight:600;line-height:1;color:var(--org-deep)}
.day-card .date-blk .dc-mo{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:600}
.day-card .price-blk{flex:1;text-align:right;min-width:0}
.day-card .price-blk .pc-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:4px}
/* occupancy line above the price */
.pc-occ{font-size:11px;font-family:'DM Mono',monospace;color:var(--ink);font-weight:500;margin-bottom:5px}
.pc-occ .pc-occ-stly{color:var(--muted);font-weight:400}
.pc-occ .occ-good{color:var(--up);font-weight:700}
.pc-occ .occ-bad{color:var(--down);font-weight:700}
.pc-occ .occ-flat{color:var(--flat)}
/* two-column Mine | Compset compare */
.pc-compare{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.pc-compare .pcc-col{text-align:center}
.pc-compare .pcc-lab{font-size:8.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.pc-compare .pcc-val{font-family:'DM Mono',monospace;font-size:21px;font-weight:500;line-height:1.05;color:var(--ink)}
.pc-compare .pcc-val.pcc-comp{font-size:16px;color:var(--muted)}
.pc-compare .pcc-arrow{display:flex;flex-direction:column;align-items:center;font-size:15px;font-weight:700;line-height:1}
.pc-compare .pcc-arrow .pcc-diff{font-family:'DM Mono',monospace;font-size:9.5px;font-weight:600;margin-top:1px}
.pc-compare .pcc-arrow.cmp-good{color:var(--up)}     /* green = I'm lower than compset (more competitive) */
.pc-compare .pcc-arrow.cmp-bad{color:var(--down)}    /* red = I'm higher than compset */
.pc-compare .pcc-arrow.cmp-flat{color:var(--flat)}
.pc-compare .pcc-meta{flex-basis:100%;display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:1px}
.pc-compare .pcc-rank{font-family:'DM Mono',monospace;font-size:10px;color:var(--org-deep);font-weight:700}
.pc-compare .pcc-pk{font-family:'DM Mono',monospace;font-size:10px;font-weight:700}
.pc-compare .pcc-pk .pcc-pk-lab{color:var(--muted);font-weight:400;font-size:9px}
.pc-compare .pcc-pk.occ-good{color:var(--up)} .pc-compare .pcc-pk.occ-bad{color:var(--down)} .pc-compare .pcc-pk.occ-flat{color:var(--flat)}
.pc-compare.pc-compare-na .pcc-na{font-size:10.5px;color:var(--muted);font-style:italic;align-self:flex-end}
/* pencil override icon on the card */
.day-card .pc-edit{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--org-tint);border:1px solid var(--org-tint2);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;margin-left:2px}
.day-card .pc-edit:active{transform:scale(.92)}
.day-card .pc-edit.has-ovr{background:var(--org);border-color:var(--org)}
/* inline override box that drops down inside the card */
.card-ovr{flex-basis:100%;order:99;margin-top:10px;padding-top:10px;border-top:1px dashed var(--org-tint2)}
.card-ovr .co-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.card-ovr .co-row:first-child{margin-top:0}
.card-ovr .co-lab{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}
.card-ovr .co-input{flex:1;min-width:0;padding:9px 10px;border:1.5px solid var(--org);border-radius:10px;font-family:'DM Mono',monospace;font-size:15px;text-align:right;background:#fff;color:var(--ink);font-weight:500}
.card-ovr .co-btn{padding:9px 14px;border-radius:10px;background:linear-gradient(135deg,var(--org),var(--org-deep));color:#fff;font-weight:700;font-size:12px;white-space:nowrap}
.card-ovr .co-btn:active{transform:scale(.96)}
.card-ovr .co-btn.co-reset{background:#fff;color:var(--org-deep);border:1.5px solid var(--org-tint2)}
.day-card .chev{flex:0 0 auto;color:var(--org-soft);font-size:18px;font-weight:700}
.day-card.wknd{background:var(--org-tint)}
.badge-ovr{position:absolute;top:8px;right:14px;font-size:8.5px;font-weight:700;text-transform:uppercase;background:var(--org);color:#fff;padding:2px 6px;border-radius:5px;letter-spacing:.04em}

.mo-card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:11px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.mo-card.is-cur{border-color:var(--org);box-shadow:0 3px 14px rgba(210,105,30,.18)}
/* revenue vs comparison tint */
.mo-card.mo-better{background:#eef7ee;border-color:#cfe6cf}
.mo-card.mo-worse{background:#fbeded;border-color:#f0d2d2}
.mo-card.mo-equal{background:var(--card)}
.mo-card.is-cur.mo-better{border-color:var(--org)}
.mo-card.is-cur.mo-worse{border-color:var(--org)}
.mo-card .mo-edge{position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--org-soft),var(--org));opacity:0}
.mo-card.is-cur .mo-edge{opacity:1}
.mo-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.mo-name{font-family:'Playfair Display',serif;font-size:19px;font-weight:600;color:var(--ink)}
.mo-name .now-tag{font-size:11px;color:var(--org);font-weight:700;font-family:'DM Sans';margin-left:6px}
.mo-occbig{text-align:right}
.mo-occbig .ob-val{font-family:'DM Mono',monospace;font-size:15px;font-weight:500}
.mo-occbig .ob-lab{font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.04em}

/* monthly view toggle */
.mv-toggle{display:flex;gap:6px;margin-bottom:12px}
.mv-btn{flex:1;padding:10px 8px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:14px;font-weight:700;color:var(--muted);box-shadow:var(--shadow);line-height:1.1}
.mv-btn span{display:block;font-size:9.5px;font-weight:600;opacity:.8;margin-top:2px;text-transform:none;letter-spacing:0}
.mv-btn.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--org),var(--org-deep));box-shadow:0 3px 10px rgba(168,82,26,.3)}
/* stacked metric: label, big value, comparison underneath */
.mm{padding:9px 0;border-bottom:1px solid var(--line)}
.mm:last-child{border-bottom:none}
.mm-lab{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--org-deep)}
.mm-vals{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:3px}
.mm .mm-big{font-family:'DM Mono',monospace;font-size:19px;font-weight:500;color:var(--ink);line-height:1}
.mm.primary .mm-big{font-size:27px}
.mm-cmp{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.mm-d{font-weight:600;margin-left:3px}
/* year total card */
.mo-card.mo-year{background:linear-gradient(135deg,var(--org-tint),var(--card));border-color:var(--org-tint2)}
.mo-card.mo-year .mo-edge{opacity:1}
.mo-yearnote{font-size:9.5px;color:var(--muted);font-style:italic;margin-top:8px;line-height:1.4}
/* past-months drill */
.mo-drill{width:100%;padding:11px;border-radius:12px;background:var(--card);border:1.5px dashed var(--org-tint2);color:var(--org-deep);font-weight:700;font-size:12px;margin-bottom:11px;box-shadow:var(--shadow)}
.mo-drill:active{transform:scale(.99)}
.delta-up{color:var(--up)} .delta-down{color:var(--down)} .delta-flat{color:var(--flat)}

.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(60,30,5,.42);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .22s}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:480px;margin:0 auto;background:var(--card);
  border-radius:24px 24px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);max-height:90vh;overflow-y:auto;
  box-shadow:0 -8px 44px rgba(60,30,5,.22);border-top:4px solid var(--org)}
.sheet.show{transform:translateY(0)}
.sheet-grip{width:40px;height:4px;border-radius:99px;background:var(--org-tint2);margin:6px auto 14px}
.sheet h2{font-family:'Playfair Display',serif;font-size:21px;margin-bottom:2px;color:var(--org-deep)}
.sheet .sh-sub{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:16px}
.sh-hero{text-align:center;padding:18px;border-radius:18px;background:linear-gradient(135deg,var(--org-tint),var(--org-tint2));margin-bottom:16px;border:1px solid var(--org-tint2)}
.sh-hero .shh-lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--org-deep);font-weight:700}
.sh-hero .shh-price{font-family:'DM Mono',monospace;font-size:40px;font-weight:500;line-height:1.05;margin-top:4px;color:var(--org-deep)}
.sh-hero .shh-src{font-size:11px;color:var(--muted);margin-top:4px}
.sh-row{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line)}
.sh-row:last-child{border-bottom:none}
.sh-row .shr-lab{font-size:13px;color:var(--ink);font-weight:500}
.sh-row .shr-lab small{display:block;font-size:10.5px;color:var(--muted);font-weight:400;margin-top:1px}
.day-card .price-blk .pc-comp .pc-rank{color:var(--org-deep);font-weight:700}
.sh-row .shr-val{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;text-align:right}
.sh-group{margin-top:18px}
.sh-group-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--org-deep);margin-bottom:4px}
.rt-chip{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;border-radius:11px;background:var(--org-tint);margin-bottom:6px;border:1px solid var(--org-tint2)}
.rt-chip .rtc-name{font-size:12.5px;font-weight:600;color:var(--ink)}
.rt-chip .rtc-price{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;color:var(--org-deep)}
.rt-chip.is-base{background:linear-gradient(135deg,var(--org-soft),var(--org));border-color:transparent}
.rt-chip.is-base .rtc-name,.rt-chip.is-base .rtc-price{color:#fff}

.btn-expand{width:100%;margin-top:8px;padding:13px;border-radius:13px;background:linear-gradient(135deg,var(--org),var(--org-deep));color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 12px rgba(168,82,26,.3)}
.btn-expand:active{transform:scale(.98)}
.btn-expand .be-ico{font-size:16px}

.fp-step{display:flex;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
.fp-step:last-child{border-bottom:none}
.fp-step .fps-n{flex:0 0 auto;width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,var(--org-soft),var(--org));color:#fff;font-family:'DM Mono',monospace;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center}
.fp-step .fps-body{flex:1}
.fp-step .fps-lab{font-size:12.5px;font-weight:600;color:var(--ink)}
.fp-step .fps-desc{font-size:11px;color:var(--muted);margin-top:1px;line-height:1.4}
.fp-step .fps-val{font-family:'DM Mono',monospace;font-size:13.5px;font-weight:500;white-space:nowrap;color:var(--org-deep);text-align:right}
.fac{display:flex;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line);align-items:center}
.fac:last-child{border-bottom:none}
.fac .fac-code{flex:0 0 auto;width:26px;height:26px;border-radius:8px;color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace}
.fac .fac-body{flex:1}
.fac .fac-name{font-size:12.5px;font-weight:600;color:var(--ink)}
.fac .fac-desc{font-size:10.5px;color:var(--muted);margin-top:1px}
.fac .fac-mult{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;white-space:nowrap}
.fac .fac-na{font-size:10px;color:var(--muted);font-style:italic}
.fac-final{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:13px;border-radius:13px;background:linear-gradient(135deg,var(--org-tint),var(--org-tint2));border:1px solid var(--org-tint2)}
.fac-final .ff-lab{font-size:12px;font-weight:700;color:var(--org-deep);text-transform:uppercase;letter-spacing:.04em}
.fac-final .ff-val{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:var(--org-deep)}

.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .e-ico{font-size:34px;margin-bottom:10px;opacity:.5}
.spinner{width:30px;height:30px;border:3px solid var(--org-tint2);border-top-color:var(--org);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.panel{display:none} .panel.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.collapse{overflow:hidden;max-height:0;transition:max-height .35s ease}
.collapse.open{max-height:4000px}
#rate-chart{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 8px 6px;box-shadow:var(--shadow);margin-bottom:12px}
.rate-legend{display:flex;flex-wrap:wrap;gap:12px;padding:0 4px;margin-bottom:8px}
.rate-legend .rl-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink);font-weight:500}
.rate-legend .rl-line{width:16px;height:3px;border-radius:2px;display:inline-block}
.rate-legend .rl-dash{width:16px;height:0;border-top:2px dashed var(--muted)}
.rate-legend .rl-area{width:14px;height:11px;border-radius:3px;opacity:.18;display:inline-block}
.rate-note{font-size:10.5px;color:var(--muted);line-height:1.45;padding:0 4px}
/* override section in drill-in */
.ovr-box{margin-top:18px;padding:14px;border-radius:14px;background:var(--org-tint);border:1px solid var(--org-tint2)}
.ovr-box .ovr-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--org-deep);margin-bottom:8px}
.ovr-row{display:flex;gap:8px;align-items:center}
.ovr-row .ovr-cur{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);flex:1}
.ovr-input{width:96px;padding:9px 10px;border:1.5px solid var(--org);border-radius:10px;font-family:'DM Mono',monospace;font-size:15px;text-align:right;background:#fff;color:var(--ink);font-weight:500}
.ovr-btn{padding:9px 14px;border-radius:10px;background:linear-gradient(135deg,var(--org),var(--org-deep));color:#fff;font-weight:700;font-size:12px}
.ovr-btn:active{transform:scale(.97)}
.ovr-btn.ovr-reset{background:#fff;color:var(--org-deep);border:1.5px solid var(--org-tint2)}
.ovr-sim{margin-top:12px;padding-top:12px;border-top:1px dashed var(--org-tint2)}

.ovr-sim-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px}
.ovr-sim-row .osr-lab{color:var(--ink)}
.ovr-sim-row .osr-val{font-family:'DM Mono',monospace;font-weight:500}
.ovr-active-badge{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;background:var(--org);color:#fff;padding:2px 7px;border-radius:5px;margin-left:6px}
</style>
</head>
<body>
<div id="app">
  <div class="app-head">
    <div class="app-title"><span class="dot"></span>RMES <span class="lite">Mobile</span></div>
    <div class="app-sub" id="head-sub">Revenue Intelligence · loading…</div>
  </div>
  <div class="struct-row" id="struct-row"></div>
  <div class="panel active" id="panel-days">
    <div class="cal-wrap">
      <div class="cal-head">
        <div class="cal-month" id="cal-month">—</div>
        <div class="cal-nav">
          <button class="cal-btn today-btn" id="cal-today">Today</button>
          <button class="cal-btn" id="cal-prev">‹</button>
          <button class="cal-btn" id="cal-next">›</button>
        </div>
      </div>
      <div class="cal-strip" id="cal-strip"></div>
    </div>
    <main>
      <div class="section-label" id="days-label">Suggested price · next 7 days</div>
      <div id="days-list"><div class="spinner"></div></div>
    </main>
  </div>
  <div class="panel" id="panel-month">
    <main>
      <div class="section-label">Monthly · year total + month by month</div>
      <div id="month-list"><div class="spinner"></div></div>
    </main>
  </div>
  <div class="panel" id="panel-rate">
    <main>
      <div class="section-label" id="rate-label">Rate Shopper · your Expedia price vs compset · next 7 days</div>
      <div id="rate-chart"><div class="spinner"></div></div>
      <div id="rate-legend"></div>
    </main>
  </div>
</div>
<div class="tabbar"><div class="tabbar-inner">
  <button class="tabbtn active" data-tab="days"><span class="ico">📅</span>Daily Price</button>
  <button class="tabbtn" data-tab="month"><span class="ico">📊</span>Monthly</button>
  <button class="tabbtn" data-tab="rate"><span class="ico">📈</span>Rate Shopper</button>
</div></div>
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet"><div class="sheet-grip"></div><div id="sheet-body"></div></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script>
/* RMES MOBILE APP v2 — reuses engine.js (same RMES logic as the dashboard).
   Orange theme everywhere; day drill-in with a 2nd inner click → Foundation 6 steps
   + 5 RMES factors; room categories ordered by price; monthly overview with OTB big
   + STLY / LY / Forecast small for Revenue, ADR and Occupancy. */
const MOB = { struct:'firenze', winStart:null, tab:'days', lastDay:null, lastRow:null, monthView:'otb', monthPast:false };
const MOB_STRUCTS = ['firenze','condotta','alfani','davids'];
const DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MO_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MO_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MOB_TARGET_CASE = { target_superato:'target exceeded', vicino_target:'near target', sotto_target:'below target' };
const MOB_FACTORS = [
  {key:'occ_mult',   naKey:'occ',   code:'A', name:'Demand (occupancy)', desc:'Current-day OCC vs STLY (-364d)',            color:'#d2691e'},
  {key:'price_mult', naKey:'price', code:'B', name:'Demand (price)',      desc:'Current-day ADR vs STLY',                   color:'#c4823b'},
  {key:'pace_mult',  naKey:'pace',  code:'C', name:'Pace trend',          desc:'4-week pickup vs STLY (recent weeks weighted)', color:'#a8521a'},
  {key:'comp_mult',  naKey:'comp',  code:'D', name:'Online pricing',      desc:'My Expedia vs compset average (inverted)',  color:'#b5651d'},
  {key:'air_mult',   naKey:'air',   code:'E', name:'Demand (Expedia)',    desc:'Expedia searches vs month median',          color:'#cd853f'},
];
function mobLabel(sk){ return (CFG.structures[sk] && CFG.structures[sk].label) || sk; }
function mobBaseRT(sk){ return (CFG.structures[sk] && CFG.structures[sk].baseRT) || null; }
/* ---- Expedia helpers (reuse engine conversion + EXPEDIA_DATA, same logic as the dashboard) ---- */
function mobExpDivisor(sk){ try{ return (typeof fp_expToBeddyDivisor==='function')?fp_expToBeddyDivisor(sk):1.053; }catch(e){ return 1.053; } }
function mobToExpedia(beddyPrice, sk){ if(beddyPrice==null||!isFinite(beddyPrice)) return null; return beddyPrice * mobExpDivisor(sk); }
function mobCompsetAvg(sk, iso){
  if(typeof EXPEDIA_DATA==='undefined'||!EXPEDIA_DATA) return null;
  let m=null;
  if(sk==='condotta') m=EXPEDIA_DATA.compset_avg;
  else if(sk==='alfani') m=EXPEDIA_DATA.compset_avg_alfani;
  else if(sk==='davids') m=EXPEDIA_DATA.compset_avg_davids;
  else m=EXPEDIA_DATA.compset_avg_firenze;
  const v=m?m[iso]:null; return (v!=null&&isFinite(v)&&v>0)?v:null;
}
function mobCompetitors(sk){
  if(typeof EXPEDIA_DATA==='undefined'||!EXPEDIA_DATA) return null;
  if(sk==='condotta') return EXPEDIA_DATA.competitors;
  if(sk==='alfani') return EXPEDIA_DATA.competitors_alfani;
  if(sk==='davids') return EXPEDIA_DATA.competitors_davids;
  return EXPEDIA_DATA.competitors_firenze;
}
function mobCompBand(sk, iso){
  const cm=mobCompetitors(sk); if(!cm) return null;
  const vals=[];
  for(const name in cm){ const p=cm[name][iso]; if(p!=null&&isFinite(p)&&p>0) vals.push(p); }
  if(!vals.length) return null;
  vals.sort((a,b)=>a-b);
  return { min:vals[0], max:vals[vals.length-1], med:vals[Math.floor(vals.length/2)], n:vals.length };
}
/* market position for a day — SAME logic as the dashboard Big Picture compset rank:
   rank = (competitors priced below me) + 1, out of (competitors priced + me). 1 = cheapest. */
function mobCompRank(sk, iso, myExpedia){
  if(myExpedia==null||!isFinite(myExpedia)) return null;
  const cm=mobCompetitors(sk); if(!cm) return null;
  const prices=[];
  for(const name in cm){ const v=cm[name][iso]; if(v!=null&&isFinite(v)&&v>0) prices.push(v); }
  if(!prices.length) return null;
  const rank = prices.filter(p=>p<myExpedia).length + 1;
  return { rank, total: prices.length+1 };
}
function ymdNumToDate(n){ return new Date(Math.floor(n/10000), Math.floor((n%10000)/100)-1, n%100); }
function dateToYmdNum(d){ return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate(); }
function todayYmdNum(){ return dateToYmdNum(new Date()); }
function addDaysYmd(n, days){ const d=ymdNumToDate(n); d.setDate(d.getDate()+days); return dateToYmdNum(d); }
function isWeekendYmd(n){ const dow=ymdNumToDate(n).getDay(); return dow===0||dow===6; }
function ymdNumToISO(n){ const s=String(n); return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8); }

function mobRenderStructPills(){
  const row = document.getElementById('struct-row');
  row.innerHTML = MOB_STRUCTS.map(sk=>`<button class="spill ${sk===MOB.struct?'active':''}" data-struct="${sk}">${escapeHtml(mobLabel(sk))}</button>`).join('');
  row.querySelectorAll('.spill').forEach(b=> b.addEventListener('click', ()=> mobSetStruct(b.dataset.struct)));
}
function mobSetStruct(sk){
  if(sk===MOB.struct) return;
  MOB.struct=sk; MOB.winStart=null;
  if(typeof fp_ensureStruct==='function'){ try{ fp_ensureStruct(sk); }catch(e){ console.error(e); } }
  if(typeof setStructure==='function'){ try{ setStructure(sk); }catch(e){} }
  mobRenderStructPills(); mobRenderAll();
}
function mobRenderCalendar(){
  const start = MOB.winStart || todayYmdNum();
  const today = todayYmdNum();
  const firstDate = ymdNumToDate(start);
  document.getElementById('cal-month').textContent = MO_FULL[firstDate.getMonth()]+' '+firstDate.getFullYear();
  let html='';
  for(let i=0;i<14;i++){
    const yn=addDaysYmd(start,i); const d=ymdNumToDate(yn);
    html += `<button class="cal-day ${i===0?'sel':''} ${yn===today?'is-today':''} ${isWeekendYmd(yn)?'wknd':''}" data-cal="${yn}">
      <div class="dow">${DOW_SHORT[d.getDay()]}</div><div class="dnum">${d.getDate()}</div></button>`;
  }
  const strip=document.getElementById('cal-strip'); strip.innerHTML=html;
  strip.querySelectorAll('.cal-day').forEach(b=> b.addEventListener('click', ()=>{ MOB.winStart=+b.dataset.cal; mobRenderAll(); }));
}
function mobRenderDays(){
  const list=document.getElementById('days-list');
  const start=MOB.winStart||todayYmdNum(); const today=todayYmdNum();
  document.getElementById('days-label').textContent=(start===today)?'Suggested price · next 7 days':'Suggested price · 7 days from '+mobFmtDate(start);
  let map; try{ map=computeRMESPriceMap(MOB.struct,start,7); }catch(e){ console.error(e); list.innerHTML=mobEmpty('⚠️','Could not compute prices.'); return; }
  const keys=Object.keys(map).map(Number).sort((a,b)=>a-b);
  if(!keys.length){ list.innerHTML=mobEmpty('📭','No price data for this window.'); return; }
  // occupancy OTB vs STLY per day (snapshot now) + pickup last 7 days vs STLY per day
  let occByDay={}, pkByDay={};
  try{
    const A=aggSellStrategy(MOB.struct, start, 7, 0);
    if(A&&A.rows) A.rows.forEach(r=>{ occByDay[r.ymd]={ cur:(isFinite(r.curOcc)?r.curOcc:null), stly:(isFinite(r.stlyOcc)?r.stlyOcc:null) }; });
  }catch(e){ console.error('occByDay',e); }
  try{
    const P=aggSellStrategy(MOB.struct, start, 7, 7); // pickup window = last 7 days
    if(P&&P.rows) P.rows.forEach(r=>{ pkByDay[r.ymd]={ cur:(isFinite(r.pkRn)?r.pkRn:null), stly:(isFinite(r.pkRnStly)?r.pkRnStly:null) }; });
  }catch(e){ console.error('pkByDay',e); }
  list.innerHTML=keys.map(yn=>{
    const r=map[yn]; const d=ymdNumToDate(yn); const isT=(yn===today);
    const anyOvr=r.overrideUsedByRT && Object.values(r.overrideUsedByRT).some(v=>v);
    const iso=ymdNumToISO(yn);
    const expPrice=mobToExpedia(r.price, MOB.struct);
    const comp=mobCompsetAvg(MOB.struct, iso);
    const rk=mobCompRank(MOB.struct, iso, expPrice);
    // two-column compare: Mine | Compset. Per your choice, GREEN = I'm LOWER than compset (more competitive).
    let compareHtml='';
    if(comp!=null && expPrice!=null){
      const diff=expPrice-comp;            // <0 means I'm cheaper
      const lower = diff<0;                // cheaper than market
      const cls = (Math.abs(diff)<0.5) ? 'cmp-flat' : (lower ? 'cmp-good' : 'cmp-bad'); // good=green=lower
      const ar  = (Math.abs(diff)<0.5) ? '•' : (lower ? '▼' : '▲');
      const rkTxt = rk ? `${rk.rank}/${rk.total}` : '';
      // pickup last 7 days delta vs STLY (small arrow): green = better than STLY
      const pk=pkByDay[yn]||{cur:null,stly:null};
      let pkHtml='';
      if(pk.cur!=null && pk.stly!=null && (pk.cur!==0 || pk.stly!==0)){
        const dd=pk.cur-pk.stly; const pcls=dd>0?'occ-good':(dd<0?'occ-bad':'occ-flat'); const par=dd>0?'▲':(dd<0?'▼':'•');
        pkHtml=`<span class="pcc-pk ${pcls}">${par}${dd>0?'+':''}${dd} <span class="pcc-pk-lab">p/u</span></span>`;
      }
      compareHtml=`<div class="pc-compare">
        <div class="pcc-col"><div class="pcc-lab">Mine</div><div class="pcc-val">${fmtEUR(expPrice)}</div></div>
        <div class="pcc-arrow ${cls}">${ar}<span class="pcc-diff">${(diff>=0?'+':'')}${fmtEUR(diff)}</span></div>
        <div class="pcc-col"><div class="pcc-lab">Compset</div><div class="pcc-val pcc-comp">${fmtEUR(comp)}</div></div>
        <div class="pcc-meta">${rkTxt?`<span class="pcc-rank">€ ${rkTxt}</span>`:''}${pkHtml}</div>
      </div>`;
    } else {
      compareHtml=`<div class="pc-compare pc-compare-na">
        <div class="pcc-col"><div class="pcc-lab">Mine</div><div class="pcc-val">${expPrice!=null?fmtEUR(expPrice):'—'}</div></div>
        <div class="pcc-na">compset n/d</div>
      </div>`;
    }
    // occupancy line (above the price): OCC OTB vs STLY with coloured arrow (green = higher = filling better)
    const occ=occByDay[yn]||{cur:null,stly:null};
    let occHtml='';
    if(occ.cur!=null || occ.stly!=null){
      const c=occ.cur!=null?Math.round(occ.cur*100):null, s=occ.stly!=null?Math.round(occ.stly*100):null;
      let arr='', acls='occ-flat';
      if(c!=null && s!=null){ const dd=c-s; if(dd>0.5){arr='▲';acls='occ-good';} else if(dd<-0.5){arr='▼';acls='occ-bad';} else {arr='•';acls='occ-flat';} }
      occHtml=`<div class="pc-occ">OCC ${c!=null?c+'%':'—'} <span class="${acls}">${arr}</span> <span class="pc-occ-stly">vs ${s!=null?s+'%':'—'}</span></div>`;
    }
    return `<div class="day-card ${isWeekendYmd(yn)?'wknd':''}" data-day="${yn}"><div class="edge"></div>
      ${anyOvr?'<div class="badge-ovr">override</div>':''}
      <div class="date-blk"><div class="dc-dow">${DOW_SHORT[d.getDay()]}${isT?' ·':''}</div><div class="dc-day">${d.getDate()}</div><div class="dc-mo">${MO_SHORT[d.getMonth()]}</div></div>
      <div class="price-blk">${occHtml}<div class="pc-label">Expedia price · vs compset</div>${compareHtml}</div>
      <button class="pc-edit ${anyOvr?'has-ovr':''}" data-edit="${yn}" title="Override price" aria-label="Override price">✏️</button>
      <div class="chev">›</div></div>`;
  }).join('');
  list.querySelectorAll('.day-card').forEach(c=> c.addEventListener('click', (ev)=>{
    if(ev.target.closest('.pc-edit') || ev.target.closest('.card-ovr')) return; // taps inside the edit control don't open the drill-in
    mobOpenDay(+c.dataset.day, map[+c.dataset.day]);
  }));
  list.querySelectorAll('.pc-edit').forEach(btn=> btn.addEventListener('click', (ev)=>{ ev.stopPropagation(); mobToggleCardOverride(+btn.dataset.edit, btn.closest('.day-card'), map); }));
}
function mobFmtDate(yn){ const d=ymdNumToDate(yn); return DOW_SHORT[d.getDay()]+' '+d.getDate()+' '+MO_SHORT[d.getMonth()]; }
/* quick override directly on the card (opened by the pencil icon). Price entered in Beddy space, like the drill-in. */
function mobToggleCardOverride(yn, cardEl, map){
  if(!cardEl) return;
  const existing = cardEl.querySelector('.card-ovr');
  if(existing){ existing.remove(); return; } // toggle off if already open
  const baseRT = mobBaseRT(MOB.struct);
  const r = map[yn] || MOB.lastRow;
  const suggested = (r && r.rmesSuggestedByRT && baseRT!=null && r.rmesSuggestedByRT[baseRT]!=null) ? r.rmesSuggestedByRT[baseRT] : (r?r.price:null);
  let curOvr=null; try{ const o=fp_getOverride(MOB.struct, ymdNumToISO(yn), baseRT); if(o&&o.price!=null&&isFinite(o.price)) curOvr=o.price; }catch(e){}
  const box=document.createElement('div');
  box.className='card-ovr';
  box.innerHTML=`<div class="co-row">
      <span class="co-lab">Override <b>${escapeHtml(baseRT||'base')}</b> · RMES ${suggested!=null?fmtEUR(suggested):'—'} (Beddy)</span>
    </div>
    <div class="co-row">
      <input class="co-input" type="number" inputmode="decimal" placeholder="${suggested!=null?Math.round(suggested):''}" value="${curOvr!=null?curOvr:''}">
      <button class="co-btn co-save">Save</button>
      ${curOvr!=null?'<button class="co-btn co-reset">Reset</button>':''}
    </div>`;
  cardEl.appendChild(box);
  const inp=box.querySelector('.co-input'); if(inp){ inp.focus(); }
  box.querySelector('.co-save').addEventListener('click', (ev)=>{
    ev.stopPropagation();
    const v=parseFloat(inp.value);
    try{ fp_setOverride(MOB.struct, ymdNumToISO(yn), baseRT, (isFinite(v)&&v>0)?v:null, null); }catch(e){ console.error(e); }
    mobInvalidateRmesCache();
    mobRenderDays(); // re-render the list so Expedia price + position + badge update
  });
  const resetBtn=box.querySelector('.co-reset');
  if(resetBtn) resetBtn.addEventListener('click',(ev)=>{
    ev.stopPropagation();
    try{ fp_setOverride(MOB.struct, ymdNumToISO(yn), baseRT, null, null); }catch(e){}
    mobInvalidateRmesCache();
    mobRenderDays();
  });
}
function mobEmpty(ico,msg){ return `<div class="empty"><div class="e-ico">${ico}</div>${escapeHtml(msg)}</div>`; }

function mobOpenDay(yn, rmesRow){
  MOB.lastDay=yn; MOB.lastRow=rmesRow; MOB_DETAIL_OPEN=false;
  const d=ymdNumToDate(yn);
  let sellRow=null;
  try{ const A=aggSellStrategy(MOB.struct,yn,1,1); if(A&&A.rows&&A.rows.length) sellRow=A.rows[0]; }catch(e){ console.error('sellRow',e); }
  const occ=(rmesRow&&isFinite(rmesRow.curOcc))?Math.round(rmesRow.curOcc*100)+'%':'—';
  const otbRn=sellRow?sellRow.curRn:(rmesRow?rmesRow.curRn:null);
  const cap=sellRow?sellRow.cap:(rmesRow?rmesRow.cap:null);
  const otbAdr=sellRow?sellRow.curAdr:null;
  const stlyRn=sellRow?sellRow.stlyRn:null, stlyOcc=sellRow?sellRow.stlyOcc:null, stlyAdr=sellRow?sellRow.stlyAdr:null;
  const baseRT=mobBaseRT(MOB.struct);
  const iso=ymdNumToISO(yn);
  const expPrice=mobToExpedia(rmesRow?rmesRow.price:null, MOB.struct);
  const compAvg=mobCompsetAvg(MOB.struct, iso);
  const band=mobCompBand(MOB.struct, iso);
  let html=`<h2>${DOW_SHORT[d.getDay()]} ${d.getDate()} ${MO_FULL[d.getMonth()]} ${d.getFullYear()}</h2>
    <div class="sh-sub">${escapeHtml(mobLabel(MOB.struct))} · base ${escapeHtml(baseRT||'—')}</div>
    <div class="sh-hero"><div class="shh-lab">Expedia price</div>
      <div class="shh-price">${expPrice!=null?fmtEUR(expPrice):'—'}</div>
      <div class="shh-src">your RMES price ${fmtEUR(rmesRow?rmesRow.price:NaN)} (Beddy) · source: ${escapeHtml(rmesRow&&rmesRow.source?rmesRow.source:'—')}</div></div>`;
  /* price override — placed high, right after the hero, so it reads as the action before its effects */
  html+=mobOverrideHTML(yn, rmesRow, baseRT);
  /* Expedia vs compset block */
  html+=`<div class="sh-group"><div class="sh-group-t">Expedia · vs compset</div>`;
  if(compAvg!=null && expPrice!=null){
    const diff=expPrice-compAvg;
    html+=mobShRow('Your Expedia price', fmtEUR(expPrice), '');
    html+=mobShRow('Compset average', fmtEUR(compAvg), mobDeltaAbsEur(expPrice, compAvg));
    html+=mobShRow('Position', diff>0?'above market':(diff<0?'below market':'at market'), '');
  } else {
    html+=mobShRow('Your Expedia price', expPrice!=null?fmtEUR(expPrice):'—', '');
    html+=`<div class="sh-row"><span class="shr-lab" style="color:var(--muted);font-style:italic">No compset data for this day</span><span class="shr-val">—</span></div>`;
  }
  const rkD=mobCompRank(MOB.struct, iso, expPrice);
  if(rkD){ html+=`<div class="sh-row"><span class="shr-lab">Market position<small>1 = cheapest on Expedia</small></span><span class="shr-val"><span style="color:var(--org-deep);font-weight:700">${rkD.rank}</span> of ${rkD.total}</span></div>`; }
  if(band){ html+=mobShRow('Competitor range', fmtEUR(band.min)+' – '+fmtEUR(band.max)+' ('+band.n+')', ''); }
  html+=`</div>`;
  html+=`<div class="sh-group"><div class="sh-group-t">On the books · vs STLY (-364, same weekday)</div>`;
  html+=mobShRow('Occupancy', occ, mobDeltaPct(rmesRow?rmesRow.curOcc:null, stlyOcc, true));
  html+=mobShRow('Room-nights', (otbRn!=null?fmtNum(otbRn):'—')+(cap!=null?' / '+cap:''), mobDeltaAbs(otbRn, stlyRn));
  html+=mobShRow('ADR (booked)', (isFinite(otbAdr)&&otbAdr>0?fmtAdr(otbAdr):'—'), mobDeltaPct(otbAdr, stlyAdr));
  html+=`</div>`;
  if(rmesRow && rmesRow.pricesByRT && Object.keys(rmesRow.pricesByRT).length){
    const ordered=Object.keys(rmesRow.pricesByRT).sort((a,b)=>(rmesRow.pricesByRT[a]||0)-(rmesRow.pricesByRT[b]||0));
    html+=`<div class="sh-group"><div class="sh-group-t">Room categories · lowest price first</div>`;
    for(const rt of ordered){
      const isBase=(rt===baseRT); const ovr=rmesRow.overrideUsedByRT && rmesRow.overrideUsedByRT[rt];
      html+=`<div class="rt-chip ${isBase?'is-base':''}"><span class="rtc-name">${escapeHtml(rt)}${isBase?' ★':''}${ovr?' ·ovr':''}</span><span class="rtc-price">${fmtEUR(rmesRow.pricesByRT[rt])}</span></div>`;
    }
    html+=`</div>`;
  }
  /* price override now lives near the top (right after the hero) */
  html+=`<button class="btn-expand" id="mob-expand"><span class="be-ico">⚡</span> Show Foundation &amp; RMES detail</button><div class="collapse" id="mob-detail"></div>`;
  document.getElementById('sheet-body').innerHTML=html;
  document.getElementById('mob-expand').addEventListener('click', mobToggleDetail);
  mobBindOverride(yn, baseRT);
  mobOpenSheet();
}
/* Build override UI: input + save/reset + revenue simulation (same formula as dashboard RMES modal) */
function mobOverrideHTML(yn, rmesRow, baseRT){
  const iso=ymdNumToISO(yn);
  const suggested = (rmesRow && rmesRow.rmesSuggestedByRT && baseRT!=null && rmesRow.rmesSuggestedByRT[baseRT]!=null)
    ? rmesRow.rmesSuggestedByRT[baseRT] : (rmesRow?rmesRow.price:null);
  let curOvr=null;
  try{ const o=fp_getOverride(MOB.struct, iso, baseRT); if(o&&o.price!=null&&isFinite(o.price)) curOvr=o.price; }catch(e){}
  const isActive = curOvr!=null;
  const shownVal = isActive ? curOvr : '';
  let h=`<div class="ovr-box"><div class="ovr-t">Price override (this day · ${escapeHtml(baseRT||'base')})${isActive?'<span class="ovr-active-badge">active</span>':''}</div>
    <div class="ovr-row">

/* revenue simulation block — identical formula to the dashboard modal.
   Base 'suggested' = the RMES final price (rmesSuggestedByRT = Foundation × multiplier), same as the UI shows. */
function mobOverrideSim(yn, baseRT, newPriceBeddy){
  const iso=ymdNumToISO(yn);
  // suggested = the RMES final suggested price for the base RT (matches what the user sees), from the live map
  let suggested=null, rnAttese=null;
  try{
    const start=MOB.winStart||todayYmdNum();
    mobInvalidateRmesCache();
    const map=computeRMESPriceMap(MOB.struct, start, 7);
    if(map[yn] && map[yn].rmesSuggestedByRT && map[yn].rmesSuggestedByRT[baseRT]!=null) suggested=map[yn].rmesSuggestedByRT[baseRT];
    else if(map[yn]) suggested=map[yn].price;
  }catch(e){}
  try{ const fpR=fp_computePrice(MOB.struct, baseRT, iso); if(fpR&&fpR.detail&&isFinite(fpR.detail.rnAttese)) rnAttese=fpR.detail.rnAttese; }catch(e){}
  const elasticity = (typeof fp_getElasticity==='function')?fp_getElasticity(MOB.struct):1.0;
  if(!isFinite(newPriceBeddy)||!isFinite(suggested)||!isFinite(rnAttese)||rnAttese==null){
    return `<div class="ovr-sim-t">Revenue simulation</div><div style="font-size:11px;color:var(--muted)">Incomplete data for the simulation.</div>`;
  }
  const deltaPrice=newPriceBeddy-suggested;
  if(Math.abs(deltaPrice)<0.5) return `<div class="ovr-sim-t">Revenue simulation (${elasticity.toFixed(1)}:1)</div><div style="font-size:11px;color:var(--muted)">Price equals the RMES suggestion — no estimated impact.</div>`;
  const deltaPricePct=suggested>0?(deltaPrice/suggested):0;
  const deltaRnPct=-deltaPricePct*elasticity;
  const rnNew=rnAttese*(1+deltaRnPct);
  const revSuggested=suggested*rnAttese;
  const revNew=newPriceBeddy*rnNew;
  const deltaRev=revNew-revSuggested;
  const sgn=n=>(n>=0?'+':'');
  const revCls=deltaRev>0?'delta-up':(deltaRev<0?'delta-down':'delta-flat');
  return `<div class="ovr-sim-t">Revenue simulation · elasticity ${elasticity.toFixed(1)}:1</div>
    <div class="ovr-sim-row"><span class="osr-lab">Δ price vs RMES</span><span class="osr-val ${deltaPrice>0?'delta-up':'delta-down'}">${sgn(deltaPrice)}${fmtEUR(deltaPrice)} (${sgn(deltaPricePct*100)}${(deltaPricePct*100).toFixed(0)}%)</span></div>
    <div class="ovr-sim-row"><span class="osr-lab">Expected RN at close</span><span class="osr-val">${rnAttese.toFixed(1)} → ${rnNew.toFixed(1)} (${sgn(deltaRnPct*100)}${(deltaRnPct*100).toFixed(0)}%)</span></div>
    <div class="ovr-sim-row"><span class="osr-lab">Est. revenue this day</span><span class="osr-val">${fmtEUR(revSuggested)} → ${fmtEUR(revNew)}</span></div>
    <div class="ovr-sim-row" style="border-top:1px solid var(--org-tint2);margin-top:4px;padding-top:8px"><span class="osr-lab" style="font-weight:700">Δ revenue</span><span class="osr-val ${revCls}" style="font-weight:700">${sgn(deltaRev)}${fmtEUR(deltaRev)}</span></div>
    <div style="font-size:9.5px;color:var(--muted);font-style:italic;margin-top:6px">Same model as the dashboard: if Δprice is −X%, expected RN ≈ +X% × elasticity. An estimate, not a guarantee.</div>`;
}

/* year totals block: sums for revenue; room-night-weighted OCC; revenue/RN ADR */
function mobYearTotals(rows, monthData, isF){
  let rev=0,revCmp=0, hasRev=false, hasRevCmp=false;
  // For ADR/OCC at year level we approximate with simple presence-weighted means
  let occAcc=0,occN=0, occCmpAcc=0,occCmpN=0, adrAcc=0,adrN=0, adrCmpAcc=0,adrCmpN=0;
  rows.forEach(mr=>{ const d=monthData(mr);
    if(d.rev!=null){rev+=d.rev;hasRev=true;} if(d.revCmp!=null){revCmp+=d.revCmp;hasRevCmp=true;}
    if(d.occ!=null){occAcc+=d.occ;occN++;} if(d.occCmp!=null){occCmpAcc+=d.occCmp;occCmpN++;}
    if(d.adr!=null){adrAcc+=d.adr;adrN++;} if(d.adrCmp!=null){adrCmpAcc+=d.adrCmp;adrCmpN++;}
  });
  const cmpLab = isF?'Final LY':'STLY';
  const occ=occN?occAcc/occN:null, occCmp=occCmpN?occCmpAcc/occCmpN:null;
  const adr=adrN?adrAcc/adrN:null, adrCmp=adrCmpN?adrCmpAcc/adrCmpN:null;
  return mobMetric('Revenue', hasRev?rev:null, hasRevCmp?revCmp:null, cmpLab, 'eur', true)
       + mobMetric('ADR (avg)', adr, adrCmp, cmpLab, 'eur', false)
       + mobMetric('Occupancy (avg)', occ, occCmp, cmpLab, 'pct', false);
}
/* one stacked metric: big value + variance vs the comparison underneath */
function mobMetric(label, cur, cmp, cmpLab, kind, primary){

    const d=kind==='pct'?(a-b)*100:((a-b)/b*100); const cls=d>0.5?'delta-up':(d<-0.5?'delta-down':'delta-flat'); const ar=d>0.5?'▲':(d<-0.5?'▼':'•');
    return `<span class="mm-d ${cls}">${ar}${(d>=0?'+':'')}${Math.round(d)}${kind==='pct'?'pp':'%'}</span>`; };
  return `<div class="mm ${primary?'primary':''}">
    <div class="mm-lab">${label}</div>

  const top=[], bot=[];
  pts.forEach((p,i)=>{ if(p.band){ top.push([xs(i),ys(p.band.max)]); } });
  for(let i=pts.length-1;i>=0;i--){ if(pts[i].band){ bot.push([xs(i),ys(pts[i].band.min)]); } }
  const area=top.concat(bot);
  if(area.length>2){
    const path=area.map((pt,i)=>(i===0?'M':'L')+pt[0].toFixed(1)+','+pt[1].toFixed(1)).join(' ')+' Z';
    svg+=`<path d="${path}" fill="${org}" fill-opacity="0.16" stroke="${org}" stroke-opacity="0.30" stroke-width="1"/>`;
  }
  // compset average line (dashed grey)
  const compSeg=pts.map((p,i)=>p.comp!=null?[xs(i),ys(p.comp)]:null).filter(Boolean);
  if(compSeg.length>1){ svg+=`<polyline points="${compSeg.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="#9a8470" stroke-width="1.5" stroke-dasharray="4 3"/>`; }
  pts.forEach((p,i)=>{ if(p.comp!=null) svg+=`<circle cx="${xs(i).toFixed(1)}" cy="${ys(p.comp).toFixed(1)}" r="2.5" fill="#9a8470"/>`; });
  // my Expedia price line (solid orange, thick)
  const mineSeg=pts.map((p,i)=>p.mine!=null?[xs(i),ys(p.mine)]:null).filter(Boolean);
  if(mineSeg.length>1){ svg+=`<polyline points="${mineSeg.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${org}" stroke-width="2.5"/>`; }
  pts.forEach((p,i)=>{ if(p.mine!=null) svg+=`<circle cx="${xs(i).toFixed(1)}" cy="${ys(p.mine).toFixed(1)}" r="3" fill="${org}" stroke="#fff" stroke-width="1"/>`; });
  // x labels (day numbers)
  pts.forEach((p,i)=>{ svg+=`<text x="${xs(i).toFixed(1)}" y="${H-M.b+14}" text-anchor="middle" fill="#9a8470">${DOW_SHORT[p.d.getDay()].slice(0,2)}</text>`;
    svg+=`<text x="${xs(i).toFixed(1)}" y="${H-M.b+24}" text-anchor="middle" fill="#2a1d12" font-weight="500">${p.d.getDate()}</text>`; });
  svg+=`</svg>`;
  wrap.innerHTML=svg;
  // legend
  legend.innerHTML=`<div class="rate-legend">
    <span class="rl-item"><span class="rl-line" style="background:${org}"></span>Your Expedia price</span>
    <span class="rl-item"><span class="rl-line rl-dash"></span>Compset average</span>
    <span class="rl-item"><span class="rl-area" style="background:${org}"></span>Competitor range (min–max)</span>
  </div>
  <div class="rate-note">Your price comes from the same RMES engine as the dashboard, converted to Expedia space (×${(mobExpDivisor(MOB.struct)).toFixed(3)}). Days without Expedia data are left blank.</div>`;
}
function mobOpenSheet(){ document.getElementById('sheet-bg').classList.add('show'); document.getElementById('sheet').classList.add('show'); }
function mobCloseSheet(){ document.getElementById('sheet-bg').classList.remove('show'); document.getElementById('sheet').classList.remove('show'); MOB_DETAIL_OPEN=false; }
function mobSetTab(t){ MOB.tab=t; document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===t)); document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+t)); mobRenderAll(); }
function mobRenderAll(){ if(MOB.tab==='days'){ mobRenderCalendar(); mobRenderDays(); } else if(MOB.tab==='month'){ mobRenderMonth(); } else if(MOB.tab==='rate'){ mobRenderRateShopper(); } }
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('cal-prev').addEventListener('click', ()=>{ MOB.winStart=addDaysYmd(MOB.winStart||todayYmdNum(),-7); mobRenderAll(); });
  document.getElementById('cal-next').addEventListener('click', ()=>{ const cap=addDaysYmd(todayYmdNum(),365); const nx=addDaysYmd(MOB.winStart||todayYmdNum(),7); MOB.winStart=(nx>cap)?cap:nx; mobRenderAll(); });
  document.getElementById('cal-today').addEventListener('click', ()=>{ MOB.winStart=null; mobRenderAll(); });
  document.querySelectorAll('.tabbtn').forEach(b=> b.addEventListener('click', ()=> mobSetTab(b.dataset.tab)));
  document.getElementById('sheet-bg').addEventListener('click', mobCloseSheet);
  try {
    loadData(EMBEDDED_CSV);
    if (typeof AIRDNA_CSV !== 'undefined') loadAirdna(AIRDNA_CSV);
    if (typeof EVENTS_CSV !== 'undefined') loadEvents(EVENTS_CSV);
    if (typeof fp_ensureStruct === 'function') fp_ensureStruct(MOB.struct);
    document.getElementById('head-sub').textContent = 'Revenue Intelligence · '+(BOOKINGS?BOOKINGS.length.toLocaleString('en-GB'):'0')+' bookings';
    mobRenderStructPills(); mobRenderAll();
  } catch(e){ console.error(e); document.getElementById('days-list').innerHTML = mobEmpty('⚠️','Error loading data: '+escapeHtml(e.message)); }
});
</script>
